<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ I Love You Heart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 700px;
    text-align: center;
}

h1 {
    font-size: clamp(28px, 6vw, 42px);
    margin-bottom: 25px;
    color: #ffc5e5;
    text-shadow: 0 0 15px #ff69b4;
}

.heart-box {
    width: 100%;
    aspect-ratio: 1 / 0.85;
    position: relative;
    overflow: hidden;

    perspective: 800px;
}

#scene {
    width: 100%;
    height: 100%;

    transform: rotateY(-30deg) rotateX(8deg);
    transform-style: preserve-7d;
}

svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.love {
    font-size: 15px;
    font-weight: bold;
    fill: #ffb4dc;
    letter-spacing: 1px;

    filter: drop-shadow(0 0 5px #ff69b4);
}

.caption {
    margin-top: 15px;
    color: white;
    font-size: clamp(18px, 4vw, 28px);
    text-shadow: 0 0 12px #ff69b4;
}
</style>
</head>

<body>

<div class="container">

    <h1>Love Heart</h1>

    <div class="heart-box">
        <svg id="scene"
             viewBox="0 0 600 510"
             xmlns="">

            <defs>
                <path id="heartPath"
                    d="
                    M 300,445
                    C 260,415 65,285 65,175
                    C 65,70 195,35 300,145
                    C 405,35 535,70 535,175
                    C 535,285 340,415 300,445
                    "
                    fill="none"
                    />
            </defs>

            <g id="heartLayers"></g>

        </svg>
    </div>

    <div class="caption">I Love You ❤️</div>

</div>

<script>
const svgNS = "http://www.w3.org/2000/svg";

const layers = document.getElementById("heartLayers");
const heartPath = document.getElementById("heartPath");

const totalLayers = 1;
const wordsPerLayer = 15;

const paths = [];

// ساخت چندین مسیر قلب برای ایجاد ضخامت
for (let layer =0; layer < totalLayers; layer++) {

    const path = document.createElementNS(svgNS, "path");

    path.setAttribute(
        "d",
        heartPath.getAttribute("d")
    );

    path.setAttribute("fill", "none");

    path.setAttribute("stroke", "none");

    layers.appendChild(path);

    paths.push(path);
}

const words = [];

for (let layer = 0; layer < totalLayers; layer++) {

    const path = paths[layer];

    const length = path.getTotalLength();

    for (let i = 0; i < wordsPerLayer; i++) {

        const text = document.createElementNS(
            svgNS,
            "text"
        );

        text.textContent = "I love you ";

        text.setAttribute("class", "love");

        text.setAttribute(
            "text-anchor",
            "middle"
        );

        text.setAttribute(
            "dominant-baseline",
            "middle"
        );

        layers.appendChild(text);

        words.push({
            element: text,
            path: path,
            length: length,
            initial: (i / wordsPerLayer) * length,
            layer: layer
        });
    }
}

let animationTime = 0;

function animate() {

    animationTime += 0.4;

    words.forEach((item) => {

        const { element, path, length, initial, layer } = item;

        // حرکت نوشته روی مسیر بسته قلب
        const offset =
            (initial + animationTime + layer * 5) % length;

        const point = path.getPointAtLength(offset);

        // محاسبه جهت مسیر برای چرخش نوشته
        const next = path.getPointAtLength(
            (offset + 1) % length
        );

        let angle = Math.atan2(
            next.y - point.y,
            next.x - point.x
        ) * 180 / Math.PI;

        // تنظیم جهت نوشته‌ها
        if (angle > 95 || angle < -95) {
            angle += 190;
        }

        // لایه‌ها کمی جابه‌جا می‌شوند تا قلب ضخیم‌تر شود
        const depth = (layer - 4) * 6;

        element.setAttribute(
            "transform",
            `
            translate(${point.x}, ${point.y + depth})
            rotate(${angle})
            `
        );

        // درخشش متحرک
        const glow =
            4 + 3 * Math.sin(animationTime * 0.04 + initial);

        element.style.filter =
            `drop-shadow(0 0 ${glow}px #ff69b4)`;

        element.style.opacity =
            0.75 + 0.25 *
            Math.sin(animationTime * 0.025 + initial);

    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
